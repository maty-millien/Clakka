[package]
name = "kream"
version = "1.0.0"
edition = "2021"
description = "macOS keyboard sound engine"
publish = false
default-run = "kream_engine"

[[bin]]
name = "kream_engine"
path = "src/main.rs"

# No dependencies: the CoreAudio, CoreGraphics, CoreFoundation and Mach calls are a
# couple dozen functions, declared directly as extern "C" in the module that uses them.

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
